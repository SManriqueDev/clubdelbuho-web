version: "3"
networks:
  dokploy-network:
    external: true
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - 5003:80
    container_name: mundolector_nginx
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - dokploy-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    container_name: mundolector_php
    environment:
      TZ: America/Bogota
    volumes:
      - .:/var/www/html
    ports:
      - 9000
    networks:
      - dokploy-network